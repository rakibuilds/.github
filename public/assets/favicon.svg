<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 290 445 445" width="512" height="512" role="img" aria-label="Terminal icon" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d687d"/>
      <stop offset="0.18" stop-color="#394258"/>
      <stop offset="1" stop-color="#2b3243"/>
    </linearGradient>
    <linearGradient id="rimHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6ba" stop-opacity=".9"/>
      <stop offset="0.35" stop-color="#8793a8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8793a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="panel" cx="620" cy="350" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46526a"/>
      <stop offset="0.5" stop-color="#262e41"/>
      <stop offset="1" stop-color="#1a2131"/>
    </radialGradient>
    <linearGradient id="panelHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6ba" stop-opacity=".85"/>
      <stop offset="0.08" stop-color="#9aa6ba" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde2ea"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a57be0"/>
      <stop offset="1" stop-color="#6b3fb2"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#58d88a"/>
      <stop offset="1" stop-color="#1c9450"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- outer body -->
  <rect x="290" y="290" width="445" height="444" rx="94" fill="url(#rim)"/>
  <rect x="290.5" y="290.5" width="444" height="443" rx="93.5" fill="none" stroke="#171d2b" stroke-width="1.5"/>
  <rect x="297" y="297" width="431" height="430" rx="88" fill="none" stroke="url(#rimHi)" stroke-width="2.5"/>

  <!-- groove -->
  <rect x="322" y="322" width="381" height="379" rx="66" fill="#050c18"/>

  <!-- inner panel -->
  <rect x="327" y="327" width="371" height="369" rx="62" fill="url(#panel)"/>
  <rect x="327.5" y="327.5" width="370" height="368" rx="61.5" fill="none" stroke="url(#panelHi)" stroke-width="3"/>

  <!-- chevron -->
  <path d="M404 421 L491 510 L404 600" fill="none" stroke="url(#chev)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cursor -->
  <rect x="472" y="591" width="118" height="30" rx="15" fill="#0a1020" opacity=".35" filter="url(#soft)"/>
  <rect x="471" y="588" width="118" height="31" rx="15.5" fill="url(#pill)"/>
  <rect x="478" y="591" width="104" height="6" rx="3" fill="#ffffff" opacity=".22"/>

  <!-- status dot -->
  <circle cx="629" cy="604" r="20" fill="#0a1020" opacity=".35" filter="url(#soft)"/>
  <circle cx="629" cy="601" r="20.5" fill="url(#dot)"/>
  <ellipse cx="623" cy="593" rx="8" ry="5" fill="#ffffff" opacity=".28"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
